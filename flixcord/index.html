<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flixcord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 8h36a8 8 0 0 1 8 8v24a8 8 0 0 1-8 8H30l-12 9v-9h-4a8 8 0 0 1-8-8V16a8 8 0 0 1 8-8z' fill='%23b14dff'/%3E%3Cpath d='M24 18h18v5H30v4h10v5H30v8h-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root, [data-theme="flix"] {
  --bg0: #0b0912; --bg1: #110e1b; --bg2: #171325; --bg3: #1f1a31; --bg4: #2a2342;
  --line: rgba(255,255,255,.07); --text: #f3effc; --muted: #a39cbd; --dim: #6f6889;
  --a1: #ff3d6e; --a2: #8b5cf6; --accent: #b14dff; --grad: linear-gradient(135deg, var(--a1), var(--a2));
  --ok: #2bd98a; --idle: #ffb020; --dnd: #ff4d5e; --mention: rgba(255,176,32,.09); --mention-line: #ffb020;
}
[data-theme="midnight"] { --bg0:#0b0d10; --bg1:#121418; --bg2:#181b20; --bg3:#20242b; --bg4:#2b3038; --text:#eef0f3; --muted:#9aa1ad; --dim:#666d79; --a1:#4f7cff; --a2:#22c1ee; --accent:#4f7cff; }
[data-theme="grass"] { --bg0:#0b120c; --bg1:#101a12; --bg2:#152218; --bg3:#1c2c20; --bg4:#26392b; --text:#eef7ea; --muted:#9fb59a; --dim:#6a8166; --a1:#8be05a; --a2:#2e9e5b; --accent:#5fc24a; }
[data-theme="light"] { --bg0:#e9e6f2; --bg1:#f3f1f8; --bg2:#ffffff; --bg3:#f1eef8; --bg4:#e3def0; --line: rgba(20,10,40,.09); --text:#1d1630; --muted:#5d567a; --dim:#8b85a3; --mention: rgba(255,176,32,.16); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg0); color: var(--text); overflow: hidden; font-size: 14.5px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--text); }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 8px; } ::-webkit-scrollbar-track { background: transparent; }
.hidden { display: none !important; }

.app { display: grid; grid-template-columns: 72px 248px 1fr auto; grid-template-rows: 100vh; height: 100vh; }
.app > * { min-height: 0; }

/* ---------- server rail ---------- */
.rail { background: var(--bg0); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; overflow-y: auto; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.srv { position: relative; width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; background: var(--bg3); font-weight: 800; font-size: 18px; transition: border-radius .18s, background .18s, transform .1s; flex: 0 0 48px; }
.srv:hover { border-radius: 16px; }
.srv:active { transform: translateY(1px); }
.srv.active { border-radius: 16px; }
.srv .pill { position: absolute; left: -12px; width: 4px; border-radius: 0 4px 4px 0; background: var(--text); height: 0; transition: height .18s; }
.srv:hover .pill { height: 20px; } .srv.active .pill { height: 40px; } .srv.unread .pill { height: 8px; }
.srv .badge { position: absolute; right: -4px; bottom: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--dnd); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 3px solid var(--bg0); }
.srv.home { background: var(--bg3); }
.srv.home:hover, .srv.home.active { background: var(--grad); }
.srv .logo-in { width: 32px; height: 32px; display: block; }
.srv img.ic { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
.srv .em { font-size: 25px; line-height: 1; display: block; }
.srv .ini { font-size: 15px; font-weight: 800; letter-spacing: .3px; }
.srv .vdot { position: absolute; right: -3px; top: -3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ok); border: 3px solid var(--bg0); font-size: 9px; display: grid; place-items: center; }
.srv.add { color: var(--ok); font-size: 26px; font-weight: 500; }
.srv.add:hover { background: var(--ok); color: #fff; }
.rail-sep { width: 32px; height: 2px; border-radius: 2px; background: var(--line); flex: 0 0 2px; }
.tip { position: fixed; z-index: 90; pointer-events: none; background: #000; color: #fff; font-size: 13px; font-weight: 700; padding: 7px 10px; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.4); white-space: nowrap; }

/* ---------- channel sidebar ---------- */
.side { background: var(--bg1); display: flex; flex-direction: column; min-width: 0; }
.side-head { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 16px; border-bottom: 1px solid var(--line); font-weight: 800; cursor: pointer; flex: 0 0 52px; }
.side-head:hover { background: var(--bg2); }
.side-head span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
.channels { flex: 1; overflow-y: auto; padding: 12px 8px; }
.cat { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 4px; color: var(--dim); font-size: 11.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; }
.cat button { color: var(--dim); font-size: 18px; line-height: 1; padding: 0 2px; } .cat button:hover { color: var(--text); }
.ch { display: flex; align-items: center; gap: 7px; width: 100%; padding: 7px 8px; border-radius: 6px; color: var(--dim); font-weight: 600; margin-bottom: 2px; text-align: left; position: relative; }
.ch .hash { font-size: 19px; font-weight: 500; width: 18px; text-align: center; opacity: .8; }
.ch .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch:hover { background: var(--bg3); color: var(--muted); }
.ch.active { background: var(--bg4); color: var(--text); }
.ch.unread { color: var(--text); }
.ch.unread::before { content: ""; position: absolute; left: -8px; width: 4px; height: 8px; border-radius: 0 4px 4px 0; background: var(--text); }
.ch.voice .hash { font-size: 15px; }
a.ch { text-decoration: none; }
.vusers { margin: -2px 0 6px 30px; }
.vusers div { display: flex; align-items: center; gap: 7px; padding: 3px 6px; font-size: 13px; color: var(--muted); border-radius: 5px; }
.vusers .av { width: 22px; height: 22px; }
.voice-bar { padding: 9px 12px; background: var(--bg1); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.voice-bar .vi { flex: 1; min-width: 0; line-height: 1.25; }
.voice-bar .vi b { color: var(--ok); font-size: 13px; display: block; }
.voice-bar .vi small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.voice-bar a { color: var(--text); }
.callcard { margin-top: 6px; display: flex; align-items: center; gap: 12px; max-width: 460px; padding: 12px 14px; border-radius: 12px; background: var(--bg1); border: 1px solid var(--line); }
.callcard .ci { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); font-size: 20px; flex: 0 0 42px; }
.callcard .cm { flex: 1; min-width: 0; } .callcard .cm b { display: block; } .callcard .cm small { color: var(--muted); }
.callcard .stack { display: flex; margin-top: 4px; } .callcard .stack .av { width: 22px; height: 22px; margin-right: -6px; border: 2px solid var(--bg1); border-radius: 50%; }
a.btn { text-decoration: none; display: inline-block; text-align: center; }
.btn.go { background: var(--ok); color: #062814; }
.incoming { position: fixed; right: 20px; top: 20px; z-index: 85; width: 300px; background: var(--bg1); border: 1px solid var(--line); border-radius: 16px; padding: 18px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.55); animation: pop .2s ease; }
.incoming .ring { width: 76px; height: 76px; margin: 4px auto 10px; border-radius: 50%; animation: ring 1.2s infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 100% { box-shadow: 0 0 0 22px transparent; } }
.incoming h3 { font-size: 17px; } .incoming p { color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
.incoming .row2 { display: flex; gap: 10px; } .incoming .row2 > * { flex: 1; }
.cemoji { width: 22px; height: 22px; object-fit: contain; vertical-align: -5px; }
.big-emoji .cemoji { width: 44px; height: 44px; }
.emoji-tabs { display: flex; gap: 2px; margin-bottom: 6px; overflow-x: auto; scrollbar-width: none; }
.emoji-tabs button { font-size: 18px; padding: 4px 6px; border-radius: 6px; opacity: .55; flex: 0 0 auto; }
.emoji-tabs button.on, .emoji-tabs button:hover { opacity: 1; background: var(--bg3); }
.emoji-head { font-size: 11px; font-weight: 800; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; padding: 8px 4px 4px; grid-column: 1 / -1; }
.emoji-grid img { width: 26px; height: 26px; object-fit: contain; }
.emoji-foot { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; font-size: 12px; color: var(--muted); height: 26px; display: flex; align-items: center; gap: 8px; }
.emoji-foot span:first-child { font-size: 20px; }
.uploader { display: flex; align-items: center; gap: 12px; }
.uploader .pv { width: 64px; height: 64px; border-radius: 50%; background: var(--bg0); display: grid; place-items: center; overflow: hidden; flex: 0 0 64px; font-size: 28px; }
.uploader .pv img { width: 100%; height: 100%; object-fit: cover; }
.uploader .pv.wide { width: 140px; border-radius: 10px; flex-basis: 140px; }
.btn.sm { padding: 7px 12px; font-size: 13px; background: var(--bg0); }
.btn.sm:hover { background: var(--bg4); }
.cem-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.cem-list div { display: flex; align-items: center; gap: 6px; background: var(--bg0); padding: 4px 8px; border-radius: 8px; font-size: 12.5px; }
.cem-list img { width: 24px; height: 24px; object-fit: contain; }
.cem-list button { color: var(--dnd); }
.ch .mbadge { background: var(--dnd); color: #fff; font-size: 11px; font-weight: 800; border-radius: 9px; padding: 1px 6px; }
.me-bar { display: flex; align-items: center; gap: 9px; padding: 8px 10px; background: var(--bg0); flex: 0 0 auto; }
.me-bar .who { flex: 1; min-width: 0; line-height: 1.2; }
.me-bar .who b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-bar .who small { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.icon-btn { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--bg3); color: var(--text); }
.icon-btn.on { color: var(--text); }
.icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

.av { position: relative; flex: 0 0 auto; }
.av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.av .st { position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--bg0); background: var(--dim); }
.st.online { background: var(--ok); } .st.idle { background: var(--idle); } .st.dnd { background: var(--dnd); }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; background: var(--bg2); }
.top { height: 52px; flex: 0 0 52px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
.top .title { font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.top .title .hash { color: var(--dim); font-size: 22px; font-weight: 500; }
.top .topic { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; border-left: 1px solid var(--line); padding-left: 12px; margin-left: 4px; }
.top .search { width: 180px; transition: width .2s; background: var(--bg0); border: 0; border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none; }
.top .search:focus { width: 260px; }
.conn { font-size: 11.5px; color: var(--muted); padding: 3px 8px; border-radius: 6px; background: var(--bg3); }

.feed-wrap { flex: 1; display: flex; min-height: 0; }
.feed { flex: 1; overflow-y: auto; padding: 16px 0 8px; }
.welcome { padding: 20px 18px 16px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.welcome .big { width: 64px; height: 64px; border-radius: 50%; background: var(--bg4); display: grid; place-items: center; font-size: 34px; color: var(--muted); margin-bottom: 10px; }
.welcome h2 { font-size: 26px; font-weight: 800; }
.welcome p { color: var(--muted); margin-top: 4px; }
.day { display: flex; align-items: center; gap: 10px; margin: 14px 16px 6px; color: var(--dim); font-size: 12px; font-weight: 700; }
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.msg { position: relative; display: flex; gap: 14px; padding: 3px 16px 3px 18px; margin-top: 14px; }
.msg.cont { margin-top: 0; }
.msg:hover { background: rgba(0,0,0,.12); }
[data-theme="light"] .msg:hover { background: rgba(0,0,0,.03); }
.msg.mention { background: var(--mention); box-shadow: inset 2px 0 0 var(--mention-line); }
.msg.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { background: rgba(177,77,255,.18); } }
.msg .av { width: 40px; height: 40px; margin-top: 2px; cursor: pointer; }
.msg.cont .av { visibility: hidden; height: 0; }
.msg .time-side { width: 40px; flex: 0 0 40px; font-size: 10.5px; color: var(--dim); text-align: right; padding-top: 4px; opacity: 0; }
.msg.cont:hover .time-side { opacity: 1; }
.msg .body { flex: 1; min-width: 0; }
.msg .meta { display: flex; align-items: baseline; gap: 8px; }
.msg .meta b { font-weight: 700; cursor: pointer; }
.msg .meta b:hover { text-decoration: underline; }
.msg .meta .t { color: var(--dim); font-size: 11.5px; }
.msg .meta .tag { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px; background: var(--grad); color: #fff; }
.msg .meta .tag.co { background: color-mix(in srgb, var(--accent) 35%, var(--bg4)); }
.msg .txt { line-height: 1.45; word-wrap: break-word; white-space: pre-wrap; }
.msg .txt.big-emoji { font-size: 40px; line-height: 1.2; }
.msg .edited { color: var(--dim); font-size: 11px; margin-left: 4px; }
.txt a { color: #6cb6ff; text-decoration: none; } .txt a:hover { text-decoration: underline; }
.txt code { font-family: 'JetBrains Mono', monospace; font-size: 13px; background: var(--bg0); padding: 1px 5px; border-radius: 4px; }
.txt pre { font-family: 'JetBrains Mono', monospace; font-size: 13px; background: var(--bg0); border: 1px solid var(--line); padding: 10px 12px; border-radius: 6px; margin: 4px 0; white-space: pre-wrap; max-width: 680px; }
.txt .spoiler { background: var(--bg4); color: transparent; border-radius: 4px; padding: 0 3px; cursor: pointer; transition: .2s; }
.txt .spoiler.open { color: inherit; background: rgba(255,255,255,.08); }
.txt .ment { background: color-mix(in srgb, var(--accent) 28%, transparent); color: #d9c8ff; border-radius: 4px; padding: 0 3px; font-weight: 600; }
[data-theme="light"] .txt .ment { color: #5b2bd9; }
.txt blockquote { border-left: 4px solid var(--bg4); padding-left: 10px; color: var(--muted); margin: 2px 0; }
.reply-ref { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin: 0 0 3px -2px; cursor: pointer; white-space: nowrap; overflow: hidden; }
.reply-ref::before { content: ""; width: 26px; height: 10px; border-left: 2px solid var(--bg4); border-top: 2px solid var(--bg4); border-top-left-radius: 6px; margin-left: -34px; margin-top: 8px; flex: 0 0 26px; }
.reply-ref b { color: var(--text); font-weight: 600; }
.reply-ref span { overflow: hidden; text-overflow: ellipsis; }
.msg .img { margin-top: 6px; max-width: 420px; max-height: 340px; border-radius: 8px; display: block; cursor: zoom-in; border: 1px solid var(--line); }
.reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.react { display: flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 8px; background: var(--bg3); border: 1px solid transparent; font-size: 13.5px; }
.react:hover { border-color: var(--bg4); }
.react.mine { background: color-mix(in srgb, var(--accent) 20%, transparent); border-color: var(--accent); }
.react b { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.react.mine b { color: var(--text); }
.pinned-flag { color: var(--idle); font-size: 11px; font-weight: 700; margin-left: 6px; }

.poll { margin-top: 6px; max-width: 460px; background: var(--bg1); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.poll h4 { font-size: 14.5px; margin-bottom: 8px; }
.poll .opt { position: relative; display: flex; justify-content: space-between; width: 100%; padding: 9px 12px; border-radius: 8px; background: var(--bg3); margin-top: 6px; overflow: hidden; text-align: left; font-weight: 600; }
.poll .opt i { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 28%, transparent); transition: width .3s; }
.poll .opt.voted { box-shadow: inset 0 0 0 2px var(--accent); }
.poll .opt span { position: relative; } .poll small { color: var(--muted); display: block; margin-top: 8px; }

.tools { position: absolute; right: 16px; top: -16px; display: none; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.3); padding: 2px; z-index: 5; }
.msg:hover .tools { display: flex; }
.tools button { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; font-size: 16px; color: var(--muted); }
.tools button:hover { background: var(--bg3); color: var(--text); }
.tools button.danger:hover { color: var(--dnd); }
.tools svg { width: 18px; height: 18px; fill: currentColor; }

.typing { height: 22px; padding: 0 18px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.typing .dots i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); margin-right: 2px; animation: bounce 1.2s infinite; }
.typing .dots i:nth-child(2) { animation-delay: .15s; } .typing .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-3px); opacity: 1; } }

.composer { margin: 0 16px 6px; background: var(--bg3); border-radius: 10px; }
.composer .ctx { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg1); border-radius: 10px 10px 0 0; }
.composer .ctx b { color: var(--text); }
.composer .row { display: flex; align-items: flex-end; gap: 4px; padding: 4px 6px; }
.composer textarea { flex: 1; resize: none; background: transparent; border: 0; outline: none; padding: 10px 6px; max-height: 220px; line-height: 1.4; font-size: 14.5px; }
.composer .send { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--grad); color: #fff; margin: 2px; }
.composer .send svg { width: 18px; height: 18px; fill: #fff; }
.composer .send:disabled { opacity: .35; cursor: default; }
.pending-img { display: flex; align-items: center; gap: 10px; padding: 10px 14px 0; }
.pending-img img { height: 64px; border-radius: 6px; }
.readonly { margin: 0 16px 14px; padding: 14px; border-radius: 10px; background: var(--bg3); color: var(--muted); text-align: center; font-size: 13.5px; }

/* mention picker */
.picker { position: absolute; bottom: 100%; left: 0; right: 0; margin-bottom: 8px; background: var(--bg1); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.35); max-height: 260px; overflow-y: auto; z-index: 20; }
.picker .h { font-size: 11px; font-weight: 800; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; padding: 4px 8px; }
.picker button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 6px; text-align: left; }
.picker button.sel, .picker button:hover { background: var(--bg3); }
.picker img { width: 24px; height: 24px; border-radius: 50%; }

.emoji-pop { position: fixed; z-index: 60; width: 372px; background: var(--bg1); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.45); padding: 10px; }
.emoji-pop input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 0; background: var(--bg0); outline: none; margin-bottom: 8px; }
.emoji-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; height: 290px; overflow-y: auto; align-content: start; }
.emoji-grid button { font-size: 22px; height: 36px; border-radius: 6px; }
.emoji-grid button:hover { background: var(--bg3); }

/* ---------- members / side panel ---------- */
.members { width: 240px; background: var(--bg1); overflow-y: auto; padding: 16px 8px; }
.members .h { color: var(--dim); font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; padding: 8px 8px 6px; }
.mem { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 6px; text-align: left; }
.mem:hover { background: var(--bg3); }
.mem.off { opacity: .45; }
.mem .av { width: 32px; height: 32px; }
.mem .av .st { border-color: var(--bg1); width: 13px; height: 13px; }
.mem .n { min-width: 0; line-height: 1.2; }
.mem .n b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mem .n small { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.panel { width: 340px; background: var(--bg1); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.panel .ph { display: flex; justify-content: space-between; align-items: center; padding: 14px 14px 10px; font-weight: 800; border-bottom: 1px solid var(--line); }
.panel .pb { flex: 1; overflow-y: auto; padding: 10px; }
.pcard { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.pcard:hover { border-color: var(--bg4); }
.pcard .m { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.pcard .m b { font-weight: 700; } .pcard .m span { color: var(--dim); font-size: 11.5px; }
.pcard .txt { font-size: 13.5px; margin-top: 3px; }
mark { background: rgba(255,176,32,.35); color: inherit; border-radius: 3px; }

/* ---------- modals / overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: grid; place-items: center; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(480px, 92vw); max-height: 88vh; overflow-y: auto; background: var(--bg2); border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.5); animation: pop .18s ease; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
.modal .mh { padding: 22px 22px 6px; text-align: center; }
.modal .mh h2 { font-size: 21px; font-weight: 800; }
.modal .mh p { color: var(--muted); margin-top: 6px; font-size: 13.5px; }
.modal .mb { padding: 14px 22px; }
.modal .mf { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; background: var(--bg1); border-radius: 0 0 12px 12px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 7px; }
.field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 0; background: var(--bg0); outline: none; }
.field input:focus, .field textarea:focus { box-shadow: 0 0 0 2px var(--accent); }
.btn { padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 14px; }
.btn.primary { background: var(--grad); color: #fff; }
.btn.primary:disabled { opacity: .5; cursor: default; }
.btn.ghost:hover { text-decoration: underline; }
.btn.danger { background: var(--dnd); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 12px; border-radius: 8px; background: var(--bg0); border: 2px solid transparent; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 7px; }
.chip.sel { border-color: var(--accent); }
.chip .sw { width: 14px; height: 14px; border-radius: 50%; }
.emoji-choices { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.emoji-choices button { font-size: 22px; height: 38px; border-radius: 8px; background: var(--bg0); border: 2px solid transparent; }
.emoji-choices button.sel { border-color: var(--accent); }
.settings-tabs { display: flex; gap: 6px; padding: 0 22px; border-bottom: 1px solid var(--line); }
.settings-tabs button { padding: 10px 6px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.settings-tabs button.active { color: var(--text); border-color: var(--accent); }
.menu { position: fixed; z-index: 70; min-width: 220px; background: #0d0b14; border-radius: 8px; padding: 6px; box-shadow: 0 12px 34px rgba(0,0,0,.5); }
[data-theme="light"] .menu { background: #fff; }
.menu button { display: flex; justify-content: space-between; width: 100%; padding: 8px 10px; border-radius: 4px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.menu button:hover { background: var(--accent); color: #fff; }
.menu button.danger { color: var(--dnd); } .menu button.danger:hover { background: var(--dnd); color: #fff; }
.menu hr { border: 0; height: 1px; background: var(--line); margin: 4px 2px; }
.lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.85); display: grid; place-items: center; cursor: zoom-out; }
.lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 99; background: var(--bg0); border: 1px solid var(--line); color: var(--text); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.4); transition: .25s; pointer-events: none; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast.err { border-color: var(--dnd); }

/* ---------- empty / onboarding ---------- */
.splash { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: radial-gradient(ellipse at 30% 0%, rgba(139,92,246,.25), transparent 60%), radial-gradient(ellipse at 80% 100%, rgba(255,61,110,.18), transparent 50%), var(--bg0); }
.splash .card { text-align: center; max-width: 440px; padding: 30px; }
.splash .logo { width: 84px; height: 84px; margin: 0 auto 16px; filter: drop-shadow(0 10px 30px rgba(177,77,255,.45)); }
.splash h1 { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
.splash h1 span { background: var(--grad); -webkit-background-clip: text; color: transparent; }
.splash p { color: var(--muted); margin: 10px 0 20px; line-height: 1.5; }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--bg4); border-top-color: var(--accent); animation: spin 1s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-main { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 30px; }
.empty-main h2 { color: var(--text); font-size: 22px; margin: 12px 0 6px; }

@media (max-width: 1100px) { .members { display: none; } }
@media (max-width: 760px) { .app { grid-template-columns: 64px 1fr; } .side { display: none; } .side.mobile-open { display: flex; position: fixed; left: 64px; top: 0; bottom: 0; width: 248px; z-index: 30; } .top .search { width: 120px; } }

// ====================================================================== markdown
function md(text) {
  let s = esc(text);
  const blocks = [];
  s = s.replace(/```(?:[a-z]*\n)?([\s\S]*?)```/g, (_, c) => { blocks.push(`<pre>${c.replace(/^\n|\n$/g, '')}</pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { blocks.push(`<code>${c}</code>`); return `\u0000${blocks.length - 1}\u0000`; });
  s = s.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  s = s.replace(/&lt;@([A-Za-z0-9_:.@+-]{3,80})&gt;/g, (_, id) => { needNames([id]); return `<span class="ment">@${esc(nameOf(id))}</span>`; });
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/__([^_\n]+)__/g, '<u>$1</u>')
       .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
       .replace(/\|\|([^|\n]+)\|\|/g, '<span class="spoiler">$1</span>')
       .replace(/:([a-z0-9_]+):/g, (m, k) => { const ce = serverEmojis()[k]; return ce ? `<img class="cemoji" src="${blob(ce)}" alt=":${k}:" title=":${k}:">` : (EMOJI_BY_NAME[k] || m); })
       .replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
  return s;
}
const plain = t => String(t).replace(/\|\|[^|]*\|\|/g, '▒▒▒').replace(/[*_~`]/g, '');
const serverEmojis = () => { const sv = S.servers.find(x => x.id === S.sid); return (sv && sv.emojis) || {}; };
const onlyEmoji = t => t && t.length <= 24 && /^(\p{Extended_Pictographic}|\p{Emoji_Component}|‍|️|\s)+$/u.test(t) && /\p{Extended_Pictographic}/u.test(t);

async function boot() {
  $('splashLogo').innerHTML = `<div class="logo">${LOGO}</div>`;
  const slow = setTimeout(() => { $('splashText').textContent = 'Still connecting… if this stays, open Flixcord on claude.ai while signed in.'; }, 10000);
  const [db, user, room, assets] = await Promise.all(['db', 'user', 'room', 'assets'].map(n => window.claude ? window.claude.use(n).catch(() => null) : Promise.resolve(null)));
  clearTimeout(slow);
  S.db = db; S.user = user; S.room = room; S.assets = assets;
  if (!db) {
    $('splashSpin').classList.add('hidden');
    $('splashText').innerHTML = 'Flixcord needs you to be <b>signed in on claude.ai</b> and invited to this page.<br>Ask whoever shared it to invite you as an <b>Editor</b> (or Contributor) so you can chat.';
    return;
  }
  if (user) {
    const me = await user.me();
    S.myId = me.id; S.me = me;
    S.names[me.id] = me.name || 'You'; S.avatars[me.id] = me.avatarUrl; S.colors[me.id] = me.color;
    S.isAdmin = !!me.isOwner; S.isSuper = !!me.isOwner;
    const w = await user.can('data.write'); S.canWrite = w !== false;
  }
  subscribeCore();
  setupRoom();
  $('splash').classList.add('hidden');
  renderAll();
}

let coreLoaded = { servers: false, channels: false };
function subscribeCore() {
  const fail = e => { if (e && e.code === 'revoked') toast('Your access to Flixcord changed.', true); };
  S.db.collection('servers').orderBy('at').onSnapshot(snap => {
    S.servers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    coreLoaded.servers = true;
    if (!S.servers.find(s => s.id === S.sid)) S.sid = S.servers[0] ? S.servers[0].id : null;
    pickChannel(); renderAll();
  }, fail);
  S.db.collection('channels').orderBy('pos').onSnapshot(snap => {
    S.channels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    coreLoaded.channels = true;
    for (const c of S.channels) if (c.lastUid) needNames([c.lastUid]);
    pickChannel(); renderAll();
  }, fail);
  S.db.collection('profiles').onSnapshot(snap => {
    S.profiles = {};
    for (const d of snap.docs) S.profiles[d.id] = d.data();
    needNames(Object.keys(S.profiles));
    const mine = S.profiles[S.myId];
    if (mine) { S.status = mine.status || 'online'; S.custom = mine.custom || ''; }
    renderMembers(); renderMe();
  }, fail);
  ensureProfile();
}
async function ensureProfile() {
  if (!S.myId || !S.canWrite) return;
  try {
    const ref = S.db.doc('profiles/' + S.myId);
    const snap = await ref.get();
    if (!snap.exists) await ref.set({ status: 'online', custom: '', joinedAt: Date.now() });
  } catch (_) { /* view-only viewers can't write */ }
}

function serverChannels(sid) { return S.channels.filter(c => c.sid === sid).sort((a, b) => (a.pos || 0) - (b.pos || 0)); }
function pickChannel() {
  const chs = serverChannels(S.sid);
  const remembered = ls.get('cid.' + S.sid, null);
  let next = chs.find(c => c.id === S.cid) || chs.find(c => c.id === remembered) || chs[0];
  if ((next && next.id) !== S.cid) openChannel(next ? next.id : null);
}

function openChannel(cid) {
  if (S.msgUnsub) { S.msgUnsub(); S.msgUnsub = null; }
  S.cid = cid; S.msgs = []; S.reply = null; S.editing = null; S.loadingMsgs = !!cid;
  if (S.sid) ls.set('sid', S.sid);
  if (cid) ls.set('cid.' + S.sid, cid);
  if (cid) {
    const t = setTimeout(() => { if (S.loadingMsgs) { S.loadingMsgs = false; showConn('Messages can\'t be reached yet'); renderFeed(); } }, 10000);
    S.msgUnsub = S.db.collection(`ch/${cid}/m`).orderBy('at', 'desc').limit(200).onSnapshot(snap => {
      clearTimeout(t); S.loadingMsgs = false; showConn('');
      const stick = nearBottom();
      const before = S.msgs.length;
      S.msgs = snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse();
      needNames(S.msgs.flatMap(m => [m.uid, m.reply && m.reply.uid]));
      markRead();
      if (S.msgs.length > before && before > 0) notifyNew(snap);
      renderFeed(stick || before === 0); renderChannels(); renderRail();
      if (S.panel) renderPanel();
    }, e => { clearTimeout(t); S.loadingMsgs = false; showConn('Could not load messages'); renderFeed(); });
  }
  pushPresence();
  renderAll();
  setTimeout(() => { const ta = $('ta'); if (ta && window.innerWidth > 760) ta.focus(); }, 0);
}
function pushPresence() {
  if (S.room && S.myId) S.room.presence({ uid: S.myId, cid: S.cid || null, status: S.status, call: S.myCall ? S.myCall.room : null, callLabel: S.myCall ? S.myCall.label : null }).catch(() => {});
}
function joinCall(room, label) { S.myCall = { room, label, at: Date.now() }; ls.set('myCall', S.myCall); pushPresence(); renderAll(); }
function leaveCall() { S.myCall = null; ls.set('myCall', null); pushPresence(); renderAll(); }
const callersIn = room => { const m = new Map(S.inCall); if (S.myId) { if (S.myCall) m.set(S.myId, S.myCall.room); else m.delete(S.myId); } return [...m].filter(([, r]) => r === room).map(([u]) => u); };
function showConn(t) { $('conn').textContent = t; $('conn').classList.toggle('hidden', !t); }

// ====================================================================== unread
const readAt = cid => ls.get('read.' + cid, 0);
function markRead() {
  if (!S.cid || document.hidden) return;
  const last = S.msgs.length ? S.msgs[S.msgs.length - 1].at : Date.now();
  if (last > readAt(S.cid)) ls.set('read.' + S.cid, last);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { markRead(); renderChannels(); renderRail(); } });
const isUnread = c => c.last && c.lastUid !== S.myId && c.last > readAt(c.id) && c.id !== S.cid;
let audioCtx = null;
function notifyNew(snap) {
  const added = snap.docChanges().filter(ch => ch.type === 'added').map(ch => ch.doc.data());
  if (added.some(m => m.uid !== S.myId && m.text && m.text.includes(`<@${S.myId}>`))) {
    try {
      audioCtx = audioCtx || new AudioContext();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; g.gain.value = .06; o.connect(g); g.connect(audioCtx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + .25); o.stop(audioCtx.currentTime + .26);
    } catch (_) {}
  }
}

// ====================================================================== room: presence + typing
function setupRoom() {
  if (!S.room) return;
  S.room.onPeers(ch => {
    const m = new Map(), calls = new Map();
    for (const p of ch.peers) {
      const uid = p.by || (p.presence && typeof p.presence.uid === 'string' ? p.presence.uid : null);
      if (!uid || p.kind !== 'viewer') continue;
      const st = p.presence && ['online', 'idle', 'dnd', 'invisible'].includes(p.presence.status) ? p.presence.status : 'online';
      m.set(uid, st);
      if (p.presence && typeof p.presence.call === 'string') calls.set(uid, p.presence.call.slice(0, 80));
    }
    S.online = m; S.inCall = calls;
    if (S.myCall && S.myId) calls.set(S.myId, S.myCall.room);
    renderChannels(); if (S.msgs.some(x => x.call)) renderFeed(false);
    needNames([...m.keys()]);
    renderMembers(); renderMe();
  }, () => {});
  S.room.on('typing', msg => {
    if (msg.sameTab || !msg.by || !msg.data || typeof msg.data.cid !== 'string') return;
    S.typing[msg.by] = { cid: msg.data.cid, until: Date.now() + 4500 };
    needNames([msg.by]); renderTyping();
  }, () => {});
  S.room.on('stoptyping', msg => { if (msg.by) { delete S.typing[msg.by]; renderTyping(); } }, () => {});
  S.room.on('ring', msg => onRing(msg), () => {});
  pushPresence();
  setInterval(renderTyping, 1000);
}
function emitTyping() {
  if (!S.room || !S.cid || Date.now() - S.lastTypingEmit < 2500) return;
  S.lastTypingEmit = Date.now();
  S.room.emit('typing', { cid: S.cid }).catch(() => {});
}
function renderTyping() {
  const now = Date.now();
  const who = Object.entries(S.typing).filter(([uid, t]) => t.cid === S.cid && t.until > now && uid !== S.myId).map(([uid]) => nameOf(uid));
  $('typing').innerHTML = who.length ? `<span class="dots"><i></i><i></i><i></i></span><span><b>${esc(who.slice(0, 3).join(', '))}</b> ${who.length > 1 ? 'are' : 'is'} typing…</span>` : '';
}

let tipEl = null;
function tip(el, text) {
  el.addEventListener('mouseenter', () => { tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.textContent = text; document.body.appendChild(tipEl); const r = el.getBoundingClientRect(); tipEl.style.left = (r.right + 14) + 'px'; tipEl.style.top = (r.top + r.height / 2 - tipEl.offsetHeight / 2) + 'px'; });
  el.addEventListener('mouseleave', () => { if (tipEl) tipEl.remove(); tipEl = null; });
}
function renderRail() {
  const r = $('rail'); r.innerHTML = '';
  const home = document.createElement('button'); home.className = 'srv home'; home.innerHTML = `<span class="pill"></span><span class="logo-in">${LOGO}</span>`;
  home.onclick = () => openSettings('profile'); tip(home, 'Flixcord'); r.appendChild(home);
  const sep = document.createElement('div'); sep.className = 'rail-sep'; r.appendChild(sep);
  for (const s of S.servers) {
    const b = document.createElement('button');
    const chs = serverChannels(s.id);
    const unread = s.id !== S.sid && chs.some(isUnread);
    b.className = 'srv' + (s.id === S.sid ? ' active' : '') + (unread ? ' unread' : '');
    b.style.background = s.id === S.sid && !s.icon ? (s.color || 'var(--accent)') : '';
    const inVoice = S.myCall && chs.some(c => roomId('v-' + c.id) === S.myCall.room);
    b.innerHTML = `<span class="pill"></span>${s.icon ? `<img class="ic" src="${blob(s.icon)}" alt="">` : s.emoji ? `<span class="em">${esc(s.emoji)}</span>` : `<span class="ini">${esc((s.name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase())}</span>`}${inVoice ? '<span class="vdot">🔊</span>' : ''}`;
    b.onmouseenter = () => { if (!s.icon) b.style.background = s.color || 'var(--accent)'; };
    b.onmouseleave = () => { b.style.background = s.id === S.sid && !s.icon ? (s.color || 'var(--accent)') : ''; };
    b.onclick = () => { S.sid = s.id; ls.set('sid', s.id); S.cid = null; pickChannel(); renderAll(); };
    tip(b, s.name || 'Server');
    r.appendChild(b);
  }
  if (S.canWrite) {
    const add = document.createElement('button'); add.className = 'srv add'; add.textContent = '+';
    add.onclick = createServerModal; tip(add, 'Create a server'); r.appendChild(add);
  }
}
function curServer() { return S.servers.find(s => s.id === S.sid) || null; }

const isCo = (s, uid) => !!(s && Array.isArray(s.admins) && s.admins.includes(uid));

// ====================================================================== render: main
function renderHeader() {
  const c = curChannel();
  $('chName').textContent = c ? c.name : (curServer() ? 'no channel' : 'Flixcord');
  $('chTitle').querySelector('.hash').classList.toggle('hidden', !c);

}
const nearBottom = () => { const f = $('feed'); return f.scrollHeight - f.scrollTop - f.clientHeight < 120; };

function renderFeed(scrollDown) {
  const f = $('feed');
  const s = curServer(), c = curChannel();
  if (!s) { f.innerHTML = emptyState(); bindEmpty(); renderComposer(); return; }
  if (!c) { f.innerHTML = `<div class="empty-main"><div><div style="font-size:48px">#</div><h2>No channels yet</h2><p>${canManage(s) ? 'Create one with the + next to TEXT CHANNELS.' : 'Ask the server owner to create one.'}</p></div></div>`; renderComposer(); return; }
  const prevTop = f.scrollTop, prevH = f.scrollHeight;
  let html = `<div class="welcome"><div class="big">#</div><h2>Welcome to #${esc(c.name)}!</h2><p>This is the start of the #${esc(c.name)} channel${c.topic ? ' — ' + esc(c.topic) : ''}.</p></div>`;
  if (S.loadingMsgs) html += '<div style="padding:30px"><div class="spin"></div></div>';
  let lastDay = '', last = null;
  for (const m of S.msgs) {
    const day = new Date(m.at).toDateString();
    if (day !== lastDay) { html += `<div class="day">${esc(fmtDay(m.at))}</div>`; lastDay = day; last = null; }
    const cont = last && last.uid === m.uid && m.at - last.at < 5 * 60000 && !m.reply && !m.poll && !m.call;
    html += msgHtml(m, cont);
    last = m;
  }
  f.innerHTML = html;
  bindFeed();
  if (scrollDown) f.scrollTop = f.scrollHeight;
  else f.scrollTop = prevTop + (f.scrollHeight - prevH) * 0;
  renderComposer();
  renderTyping();
}

function msgHtml(m, cont) {
  const mine = m.uid === S.myId;
  const mentioned = m.text && S.myId && m.text.includes(`<@${S.myId}>`);
  const s = curServer();
  const isOwnerTag = s && s.owner === m.uid, isCoTag = !isOwnerTag && isCo(s, m.uid);
  const reacts = Object.entries(m.react || {}).filter(([, us]) => Array.isArray(us) && us.length);
  const replyRef = m.reply ? `<div class="reply-ref" data-jump="${esc(m.reply.id)}">${avatarHtml(m.reply.uid, 16)}<b>${esc(nameOf(m.reply.uid))}</b><span>${esc(plain(m.reply.text || '🖼️ image').slice(0, 120))}</span></div>` : '';
  const big = !m.poll && !m.img && (onlyEmoji(m.text) || /^(\s*:[a-z0-9_]+:\s*){1,3}$/.test(m.text || '') && Object.keys(serverEmojis()).length && (m.text.match(/:([a-z0-9_]+):/g) || []).every(x => serverEmojis()[x.slice(1, -1)]));
  const body = `${m.text ? `<div class="txt ${big ? 'big-emoji' : ''}">${md(m.text)}${m.edited ? '<span class="edited">(edited)</span>' : ''}</div>` : ''}` +
    (m.call ? callCardHtml(m) : '') +
    (m.img ? `<img class="img" src="/_blob/${esc(m.img)}" alt="" loading="lazy" data-zoom="1">` : '') +
    (m.poll ? pollHtml(m) : '') +
    (reacts.length ? `<div class="reacts">${reacts.map(([e, us]) => { const ce = /^:[a-z0-9_]+:$/.test(e) && serverEmojis()[e.slice(1, -1)]; return `<button class="react ${us.includes(S.myId) ? 'mine' : ''}" data-react="${esc(e)}" title="${esc(us.map(nameOf).join(', '))}">${ce ? `<img class="cemoji" src="${blob(ce)}" alt="${esc(e)}">` : esc(e)}<b>${us.length}</b></button>`; }).join('')}</div>` : '');
  const tools = S.canWrite ? `<div class="tools">
      <button data-act="react" title="Add reaction">${ICON.react}</button>
      <button data-act="reply" title="Reply">${ICON.reply}</button>
      ${mine && !m.poll ? `<button data-act="edit" title="Edit">${ICON.edit}</button>` : ''}
      ${canManage(s) || mine ? `<button data-act="pin" title="${m.pinned ? 'Unpin' : 'Pin'}">${ICON.pin}</button>` : ''}
      ${mine || canManage(s) ? `<button data-act="del" class="danger" title="Delete">${ICON.del}</button>` : ''}
    </div>` : '';
  if (S.editing === m.id) {
    return `<div class="msg" data-id="${esc(m.id)}">${avatarHtml(m.uid, 40)}<div class="body"><div class="meta"><b>${esc(nameOf(m.uid))}</b></div>
      <textarea class="edit-ta" style="width:100%;background:var(--bg3);border:0;border-radius:8px;padding:10px;outline:none;resize:vertical;min-height:44px">${esc(m.text)}</textarea>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">escape to <a href="#" data-edit="cancel" style="color:#6cb6ff">cancel</a> • enter to <a href="#" data-edit="save" style="color:#6cb6ff">save</a></div></div></div>`;
  }
  if (cont) return `<div class="msg cont ${mentioned ? 'mention' : ''}" data-id="${esc(m.id)}"><div class="time-side">${esc(fmtTime(m.at))}</div><div class="body">${body}</div>${tools}</div>`;
  return `<div class="msg ${mentioned ? 'mention' : ''}" data-id="${esc(m.id)}">${avatarHtml(m.uid, 40)}<div class="body">${replyRef}
    <div class="meta"><b data-uid="${esc(m.uid)}" style="color:${S.colors[m.uid] || 'inherit'}">${esc(nameOf(m.uid))}</b>${isOwnerTag ? '<span class="tag">OWNER</span>' : ''}${isCoTag ? '<span class="tag co">CO-OWNER</span>' : ''}<span class="t">${esc(stamp(m.at))}</span>${m.pinned ? '<span class="pinned-flag">📌 pinned</span>' : ''}</div>${body}</div>${tools}</div>`;
}

function callCardHtml(m) {
  const room = String(m.call.room || ''), who = callersIn(room), live = who.length > 0, mine = S.myCall && S.myCall.room === room;
  return `<div class="callcard"><div class="ci">📞</div><div class="cm"><b>${esc(nameOf(m.uid))} started a call</b>
    <small>${live ? who.length + ' in the call now' : 'Nobody is in this call right now'}</small>
    ${live ? `<div class="stack">${who.slice(0, 6).map(u => avatarHtml(u, 22)).join('')}</div>` : ''}</div>
    ${S.myId ? `<a class="btn ${mine ? 'sm' : 'go'}" href="${esc(callLink(room, m.call.label))}" target="_blank" rel="noopener" data-joincall="${esc(room)}" data-label="${esc(m.call.label || '')}">${mine ? 'Open' : 'Join'}</a>` : ''}</div>`;
}
async function startChannelCall(e) {
  const bc = $('btnCall'), c = curChannel();
  if (!c || !S.myId) { e.preventDefault(); return; }
  const room = bc.dataset.room, label = bc.dataset.label;
  joinCall(room, label);
  if (S.room) S.room.emit('ring', { kind: 'channel', room, label, cid: c.id, sid: S.sid }).catch(() => {});
  try { await S.db.collection(`ch/${c.id}/m`).add({ uid: S.myId, text: '', at: Date.now(), call: { room, label } }); } catch (err) { writeError(err); }
  bc.dataset.cid = ''; renderHeader();
}
$('btnCall').addEventListener('click', startChannelCall);
function callPerson(uid) {
  const room = roomId('dm-' + [S.myId, uid].sort().join('-').replace(/[^a-zA-Z0-9]/g, '').slice(0, 40) + '-' + Date.now().toString(36));
  const label = nameOf(S.myId) + ' & ' + nameOf(uid);
  joinCall(room, label);
  if (S.room) S.room.emit('ring', { kind: 'dm', to: uid, room, label }).catch(() => {});
  toast('Calling ' + nameOf(uid) + '…');
  return callLink(room, label);
}
let ringTimer = null, ringAudio = null;
function stopRing() { clearInterval(ringTimer); ringTimer = null; document.querySelectorAll('.incoming').forEach(x => x.remove()); }
function onRing(msg) {
  const d = msg && msg.data; if (!d || msg.sameTab || !msg.by || msg.by === S.myId || typeof d.room !== 'string') return;
  if (d.kind === 'dm' && d.to !== S.myId) return;
  if (d.kind === 'channel' && !S.servers.some(x => x.id === d.sid)) return;
  if (S.status === 'dnd') { toast('📞 ' + nameOf(msg.by) + ' is calling (Do not disturb is on)'); return; }
  needNames([msg.by]); stopRing();
  const room = d.room.slice(0, 80), label = String(d.label || '').slice(0, 80);
  const ch = d.kind === 'channel' ? S.channels.find(x => x.id === d.cid) : null;
  const el = document.createElement('div'); el.className = 'incoming';
  el.innerHTML = `<div class="ring">${avatarHtml(msg.by, 76)}</div><h3>${esc(nameOf(msg.by))}</h3>
    <p>${d.kind === 'dm' ? 'is calling you' : 'started a call in #' + esc(ch ? ch.name : 'a channel')}</p>
    <div class="row2"><button class="btn danger" data-no>Decline</button><a class="btn go" target="_blank" rel="noopener" href="${esc(callLink(room, label))}" data-yes>Join</a></div>`;
  document.body.appendChild(el);
  el.querySelector('[data-no]').onclick = stopRing;
  el.querySelector('[data-yes]').onclick = () => { joinCall(room, label); stopRing(); };
  let n = 0;
  const beep = () => { try { audioCtx = audioCtx || new AudioContext(); [0, .18].forEach(t => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = t ? 660 : 880; g.gain.value = .07; o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + t + .16); o.stop(audioCtx.currentTime + t + .17); }); } catch (_) {} if (++n > 14) stopRing(); };
  beep(); ringTimer = setInterval(beep, 2000);
}
function pollHtml(m) {
  const total = m.poll.opts.reduce((n, o) => n + (o.v || []).length, 0);
  return `<div class="poll"><h4>📊 ${esc(m.poll.q)}</h4>${m.poll.opts.map((o, i) => {
    const n = (o.v || []).length, pct = total ? Math.round(n * 100 / total) : 0;
    return `<button class="opt ${(o.v || []).includes(S.myId) ? 'voted' : ''}" data-vote="${i}"><i style="width:${pct}%"></i><span>${esc(o.t)}</span><span>${pct}% · ${n}</span></button>`;
  }).join('')}<small>${total} vote${total === 1 ? '' : 's'} · click to vote, click again to remove</small></div>`;
}

function bindFeed() {
  const f = $('feed');
  f.querySelectorAll('.msg').forEach(el => {
    const m = S.msgs.find(x => x.id === el.dataset.id); if (!m) return;
    el.querySelectorAll('[data-act]').forEach(b => b.onclick = e => {
      e.stopPropagation();
      const a = b.dataset.act;
      if (a === 'reply') { S.reply = m; renderComposer(); $('ta').focus(); }
      if (a === 'edit') { S.editing = m.id; renderFeed(); const t = f.querySelector('.edit-ta'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
      if (a === 'del') confirmModal('Delete message', 'Are you sure you want to delete this message?', 'Delete', () => delMsg(m));
      if (a === 'pin') togglePin(m);
      if (a === 'react') emojiPopover(b, e => toggleReact(m, e));
    });
    el.querySelectorAll('[data-react]').forEach(b => b.onclick = () => toggleReact(m, b.dataset.react));
    el.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => vote(m, +b.dataset.vote));
    el.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => jumpTo(b.dataset.jump));
    el.querySelectorAll('[data-joincall]').forEach(a => a.addEventListener('click', () => joinCall(a.dataset.joincall, a.dataset.label)));
    el.querySelectorAll('.spoiler').forEach(sp => sp.onclick = () => sp.classList.toggle('open'));
    el.querySelectorAll('[data-zoom]').forEach(im => im.onclick = () => lightbox(im.src));
    el.querySelectorAll('.av[data-uid], b[data-uid]').forEach(a => a.onclick = e => profileCard(e, a.dataset.uid));
    const et = el.querySelector('.edit-ta');
    if (et) {
      et.onkeydown = e => { if (e.key === 'Escape') { S.editing = null; renderFeed(); } if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(m, et.value); } };
      el.querySelector('[data-edit=cancel]').onclick = e => { e.preventDefault(); S.editing = null; renderFeed(); };
      el.querySelector('[data-edit=save]').onclick = e => { e.preventDefault(); saveEdit(m, et.value); };
    }
  });
}
function jumpTo(id) {
  const el = $('feed').querySelector(`.msg[data-id="${CSS.escape(id)}"]`);
  if (!el) return toast('That message is too old to show here.');
  el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

// ====================================================================== composer
function renderComposer() {
  const w = $('composerWrap'); const c = curChannel();
  if (!c) { w.innerHTML = ''; return; }
  if (!S.myId || !S.canWrite) { w.innerHTML = `<div class="readonly">You can read #${esc(c.name)} but not send messages. Ask the owner to invite you as an <b>Editor</b> (or Contributor).</div>`; return; }
  const old = $('ta'); const draft = old ? old.value : ls.get('draft.' + c.id, '');
  w.innerHTML = `<div class="composer" style="position:relative">
    ${S.reply ? `<div class="ctx"><span>Replying to <b>${esc(nameOf(S.reply.uid))}</b></span><button class="icon-btn" id="cancelReply" style="width:22px;height:22px">✕</button></div>` : ''}
    ${S.pendingImg ? `<div class="pending-img"><img src="${S.pendingImg.preview}" alt=""><span style="color:var(--muted);font-size:13px">${esc(S.pendingImg.file.name)}</span><button class="icon-btn" id="cancelImg">✕</button></div>` : ''}
    <div id="picker"></div>
    <div class="row">
      ${S.assets ? `<button class="icon-btn" id="btnAttach" title="Upload an image">${ICON.image}</button>` : ''}
      <textarea id="ta" rows="1" placeholder="Message #${esc(c.name)}" maxlength="4000"></textarea>
      <button class="icon-btn" id="btnEmoji" title="Emoji">${ICON.smile}</button>
      <button class="send" id="btnSend" title="Send">${ICON.send}</button>
    </div></div>`;
  const ta = $('ta'); ta.value = draft; autosize(ta);
  ta.oninput = () => { autosize(ta); ls.set('draft.' + c.id, ta.value); if (ta.value) emitTyping(); mentionPicker(ta); };
  ta.onkeydown = e => {
    if (pickerKey(e)) return;
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    if (e.key === 'Escape') { S.reply = null; renderComposer(); }
    if (e.key === 'ArrowUp' && !ta.value) { const mine = [...S.msgs].reverse().find(m => m.uid === S.myId && !m.poll); if (mine) { e.preventDefault(); S.editing = mine.id; renderFeed(); } }
  };
  ta.onpaste = e => { const f = [...(e.clipboardData && e.clipboardData.files || [])].find(f => f.type.startsWith('image/')); if (f && S.assets) { e.preventDefault(); setPendingImg(f); } };
  $('btnSend').onclick = send;
  $('btnEmoji').onclick = () => emojiPopover($('btnEmoji'), em => { insertAtCursor(ta, em); ta.focus(); });

function autosize(t) { t.style.height = 'auto'; t.style.height = Math.min(220, t.scrollHeight) + 'px'; }
function insertAtCursor(t, s) { const a = t.selectionStart, b = t.selectionEnd; t.value = t.value.slice(0, a) + s + t.value.slice(b); t.selectionStart = t.selectionEnd = a + s.length; t.dispatchEvent(new Event('input')); }

// mention picker
let pick = null;
function memberIds() { return [...new Set([...Object.keys(S.profiles), ...S.online.keys(), ...S.msgs.map(m => m.uid)])].filter(Boolean); }
function mentionPicker(ta) {
  const before = ta.value.slice(0, ta.selectionStart);
  const m = before.match(/@([^\s@]{0,32})$/);
  if (!m) { pick = null; $('picker').innerHTML = ''; return; }
  const q = m[1].toLowerCase();
  const list = memberIds().filter(id => nameOf(id).toLowerCase().includes(q)).slice(0, 8);
  if (!list.length) { pick = null; $('picker').innerHTML = ''; return; }
  pick = { list, sel: 0, start: before.length - m[0].length, ta };
  drawPicker();
}
function drawPicker() {
  $('picker').innerHTML = `<div class="picker"><div class="h">Members</div>${pick.list.map((id, i) => `<button class="${i === pick.sel ? 'sel' : ''}" data-i="${i}">${avatarHtml(id, 24)}<b>${esc(nameOf(id))}</b></button>`).join('')}</div>`;
  $('picker').querySelectorAll('button').forEach(b => b.onmousedown = e => { e.preventDefault(); choosePick(+b.dataset.i); });
}
function choosePick(i) {
  const id = pick.list[i], ta = pick.ta, name = nameOf(id);
  S.mentions.set('@' + name, id);
  ta.value = ta.value.slice(0, pick.start) + '@' + name + ' ' + ta.value.slice(ta.selectionStart);
  pick = null; $('picker').innerHTML = ''; ta.focus(); autosize(ta);
}
function pickerKey(e) {
  if (!pick) return false;
  if (e.key === 'ArrowDown') { pick.sel = (pick.sel + 1) % pick.list.length; drawPicker(); e.preventDefault(); return true; }
  if (e.key === 'ArrowUp') { pick.sel = (pick.sel - 1 + pick.list.length) % pick.list.length; drawPicker(); e.preventDefault(); return true; }
  if (e.key === 'Enter' || e.key === 'Tab') { choosePick(pick.sel); e.preventDefault(); return true; }
  if (e.key === 'Escape') { pick = null; $('picker').innerHTML = ''; e.preventDefault(); return true; }
  return false;
}

// ====================================================================== writes
let sending = false;
async function send() {
  const ta = $('ta'); if (!ta || sending) return;
  let text = ta.value.trim();
  const c = curChannel(); if (!c) return;
  if (!text && !S.pendingImg) return;
  // slash commands
  let poll = null;
  if (text === '/shrug') text = '¯\\_(ツ)_/¯';
  else if (text.startsWith('/shrug ')) text = text.slice(7) + ' ¯\\_(ツ)_/¯';
  else if (text === '/tableflip') text = '(╯°□°)╯︵ ┻━┻';
  else if (text === '/unflip') text = '┬─┬ ノ( ゜-゜ノ)';
  else if (text.startsWith('/me ')) text = '*' + text.slice(4) + '*';
  else if (text.startsWith('/spoiler ')) text = '||' + text.slice(9) + '||';
  else if (text.startsWith('/poll')) {
    const parts = text.slice(5).split('|').map(s => s.trim()).filter(Boolean);
    if (parts.length < 3) return toast('Poll: /poll Question | Option 1 | Option 2 (up to 10 options)', true);
    poll = { q: parts[0].slice(0, 200), opts: parts.slice(1, 11).map(t => ({ t: t.slice(0, 80), v: [] })) };
    text = '';
  } else if (text.startsWith('/')) {
    const known = ['/shrug', '/tableflip', '/unflip', '/me', '/spoiler', '/poll'];
    if (!known.some(k => text.startsWith(k))) return toast('Commands: /poll, /me, /spoiler, /shrug, /tableflip, /unflip', true);
  }
  // @Name → <@id>
  for (const [label, id] of S.mentions) text = text.split(label).join(`<@${id}>`);
  sending = true; $('btnSend').disabled = true;
  try {
    let img = null;
    if (S.pendingImg) {
      toast('Uploading image…');
      const up = await S.assets.upload(S.pendingImg.file);
      img = up.id;
    }
    const at = Date.now();
    const doc = { uid: S.myId, text, at };
    if (img) doc.img = img;
    if (poll) doc.poll = poll;
    if (S.reply) doc.reply = { id: S.reply.id, uid: S.reply.uid, text: (S.reply.text || '').replace(/<@[^>]+>/g, '@…').slice(0, 140) };
    await S.db.collection(`ch/${c.id}/m`).add(doc);
    ta.value = ''; ls.set('draft.' + c.id, ''); S.reply = null; S.pendingImg = null; S.mentions.clear();
    if (S.room) S.room.emit('stoptyping', { cid: c.id }).catch(() => {});
    renderComposer(); $('feed').scrollTop = $('feed').scrollHeight;
    S.db.doc('channels/' + c.id).update({ last: at, lastUid: S.myId }).catch(() => {});
  } catch (e) { writeError(e); }
  finally { sending = false; const b = $('btnSend'); if (b) b.disabled = false; const t = $('ta'); if (t) t.focus(); }
}
function writeError(e) {
  const code = e && e.code;
  if (code === 'quota_exceeded') toast('Flixcord is full (25,000 items). The owner can delete old channels to make room.', true);
  else if (code === 'invalid_argument') { toast('You can read but not write here. Ask to be invited as an Editor.', true); S.canWrite = false; renderComposer(); }
  else if (code === 'resource_exhausted') toast('Slow down a little!', true);
  else toast('Could not send — check your connection.', true);
}
async function saveEdit(m, val) {
  const text = val.trim(); S.editing = null;
  if (!text) { renderFeed(); return confirmModal('Delete message', 'Empty message — delete it?', 'Delete', () => delMsg(m)); }
  if (text !== m.text) { try { await S.db.doc(`ch/${S.cid}/m/${m.id}`).update({ text, edited: Date.now() }); } catch (e) { writeError(e); } }
  renderFeed();
}
async function delMsg(m) { try { await S.db.doc(`ch/${S.cid}/m/${m.id}`).delete(); toast('Message deleted'); } catch (e) { writeError(e); } }
async function togglePin(m) { try { await S.db.doc(`ch/${S.cid}/m/${m.id}`).update({ pinned: !m.pinned }); toast(m.pinned ? 'Unpinned' : 'Pinned 📌'); } catch (e) { writeError(e); } }
async function toggleReact(m, e) {
  if (!S.myId) return;
  const cur = { ...(m.react || {}) };
  const list = Array.isArray(cur[e]) ? [...cur[e]] : [];
  cur[e] = list.includes(S.myId) ? list.filter(u => u !== S.myId) : [...list, S.myId];
  try { await S.db.doc(`ch/${S.cid}/m/${m.id}`).update({ react: cur }); } catch (err) { writeError(err); }
}
async function vote(m, i) {
  if (!S.myId) return;
  const opts = m.poll.opts.map(o => ({ t: o.t, v: (o.v || []).filter(u => u !== S.myId) }));
  const had = (m.poll.opts[i].v || []).includes(S.myId);
  if (!had) opts[i].v.push(S.myId);
  try { await S.db.doc(`ch/${S.cid}/m/${m.id}`).update({ poll: { q: m.poll.q, opts } }); } catch (e) { writeError(e); }
}

function place(el, anchor) {

function emojiPopover(anchor, onPick) {
