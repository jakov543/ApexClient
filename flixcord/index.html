const slug = n => n.toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9_-]/g, '').slice(0, 32);
function serverForm(s) {
  return `<div class="field"><label>Server icon</label><div class="uploader"><div class="pv" id="sPv"></div><div><button class="btn sm" id="sUp">Upload image</button> <button class="btn sm" id="sRm">Use emoji</button><div style="font-size:12px;color:var(--muted);margin-top:6px">Square images look best · max 8 MB</div></div></div></div>
    <div class="field"><label>Server name</label><input id="sName" maxlength="40" value="${esc(s ? s.name : '')}" placeholder="${esc(nameOf(S.myId))}'s server"></div>
    <div class="field" id="emojiField"><label>Emoji icon</label><div class="emoji-choices">${SERVER_EMOJI.map(e => `<button data-e="${e}">${e}</button>`).join('')}</div></div>
    <div class="field"><label>Colour</label><div class="chips">${COLORS.map(c => `<button class="chip" data-c="${c}"><span class="sw" style="background:${c}"></span></button>`).join('')}</div></div>`;
}
function bindServerForm(o, st) {
  const draw = () => {
    o.querySelector('#sPv').innerHTML = st.icon ? `<img src="${blob(st.icon)}" alt="">` : `<span>${esc(st.emoji)}</span>`;
    o.querySelector('#sPv').style.background = st.icon ? 'var(--bg0)' : st.color;
    o.querySelector('#emojiField').classList.toggle('hidden', !!st.icon);
    o.querySelector('#sRm').classList.toggle('hidden', !st.icon);
    o.querySelectorAll('[data-e]').forEach(x => x.classList.toggle('sel', x.dataset.e === st.emoji));
    o.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('sel', x.dataset.c === st.color));
  };
  o.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { st.emoji = b.dataset.e; draw(); });
  o.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { st.color = b.dataset.c; draw(); });
  o.querySelector('#sUp').onclick = () => pickFile(async f => { const id = await uploadImage(f, 8); if (id) { st.icon = id; draw(); toast('Icon ready — press Save'); } });
  o.querySelector('#sRm').onclick = () => { st.icon = null; draw(); };
  draw();
}
function createServerModal() {
  const st = { emoji: SERVER_EMOJI[Math.floor(Math.random() * SERVER_EMOJI.length)], color: COLORS[Math.floor(Math.random() * COLORS.length)], icon: null };
  modal(`<div class="mh"><h2>Create your server</h2><p>Your server is where you and your friends hang out. Give it a name and an icon — or upload your own picture.</p></div>
    <div class="mb">${serverForm(null)}</div>
    <div class="mf"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" data-ok>Create</button></div>`,
    (o, close) => {
      bindServerForm(o, st);
      o.querySelector('[data-x]').onclick = close;
      o.querySelector('[data-ok]').onclick = async () => {
        const name = (o.querySelector('#sName').value.trim() || `${nameOf(S.myId)}'s server`).slice(0, 40);
        const btn = o.querySelector('[data-ok]'); btn.disabled = true;
        try {
          const doc = { name, emoji: st.emoji, color: st.color, owner: S.myId, admins: [], at: Date.now() };
          if (st.icon) doc.icon = st.icon;
          const ref = await S.db.collection('servers').add(doc);
          let pos = 0;
          for (const [n, t, type] of [['general', 'Talk about anything', 'text'], ['gaming', 'What are we playing?', 'text'], ['clips', 'Share your best moments', 'text'], ['memes', '', 'text'], ['Lounge', '', 'voice'], ['Gaming', '', 'voice']]) {
            await S.db.collection('channels').add({ sid: ref.id, name: n, topic: t, type, pos: pos++, at: Date.now() });
          }
          S.sid = ref.id; S.cid = null; ls.set('sid', ref.id); close(); toast(`${name} is ready! 🎉`);
        } catch (e) { btn.disabled = false; writeError(e); }
      };
    });
}
function serverModal(s, tab) {
  const st = { emoji: s.emoji || SERVER_EMOJI[0], color: s.color || COLORS[0], icon: s.icon || null };
  const owner = isOwnerOf(s);
  modal(`<div class="mh"><h2>${esc(s.name)} settings</h2></div>
    <div class="settings-tabs"><button data-t="general">Overview</button><button data-t="emoji">Emoji</button>${owner ? '<button data-t="team">Co-owners</button>' : ''}</div>
    <div class="mb" id="srvBody"></div>
    <div class="mf"><button class="btn ghost" data-x>Close</button><button class="btn primary" data-ok>Save</button></div>`,
    (o, close) => {
      o.querySelector('[data-x]').onclick = close;
      const body = o.querySelector('#srvBody'), ok = o.querySelector('[data-ok]');
      const show = t => {
        o.querySelectorAll('.settings-tabs button').forEach(b => b.classList.toggle('active', b.dataset.t === t));
        ok.classList.toggle('hidden', t !== 'general');
        if (t === 'general') { body.innerHTML = serverForm(s); bindServerForm(o, st); }
        else if (t === 'emoji') {
          const em = s.emojis || {};
          body.innerHTML = `<p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">Upload your own emoji. Everyone in ${esc(s.name)} can use them with <b>:name:</b> or from the ⭐ tab in the emoji picker. Up to 50.</p>
            <div style="display:flex;gap:8px"><input id="emName" maxlength="24" placeholder="name (e.g. pog)" style="flex:1;padding:9px 12px;border-radius:8px;border:0;background:var(--bg0);outline:none"><button class="btn primary" id="emAdd">Upload</button></div>
            <div class="cem-list">${Object.entries(em).map(([n, id]) => `<div><img src="${blob(id)}" alt="">:${esc(n)}:<button data-rm="${esc(n)}" title="Delete">✕</button></div>`).join('') || '<span style="color:var(--dim);font-size:13px">No custom emoji yet.</span>'}</div>`;
          body.querySelector('#emAdd').onclick = () => {
            const n = body.querySelector('#emName').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_').slice(0, 24);
            if (n.length < 2) return toast('Give the emoji a name (2+ letters).', true);
            if (Object.keys(em).length >= 50) return toast('50 emoji max per server.', true);
            pickFile(async f => { const id = await uploadImage(f, 2); if (!id) return; try { await S.db.doc('servers/' + s.id).update({ emojis: { ...em, [n]: id } }); s.emojis = { ...em, [n]: id }; toast(`:${n}: added`); show('emoji'); } catch (e) { writeError(e); } });
          };
          body.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { const next = { ...em }; delete next[b.dataset.rm]; try { await S.db.doc('servers/' + s.id).update({ emojis: next }); s.emojis = next; show('emoji'); } catch (e) { writeError(e); } });
        } else {
          const ids = memberIds().filter(u => u !== s.owner);
          body.innerHTML = `<p style="color:var(--muted);font-size:13.5px;margin-bottom:12px">Co-owners can edit the server, create and delete channels, pin and delete any message and add emoji. Only people who have opened Flixcord appear here.</p>
            ${ids.map(u => `<div class="mem" style="cursor:default">${avatarHtml(u, 32)}<div class="n" style="flex:1"><b>${esc(nameOf(u))}</b><small>${isCo(s, u) ? '🛡️ Co-owner' : 'Member'}</small></div><button class="btn sm" data-co="${esc(u)}">${isCo(s, u) ? 'Remove' : 'Make co-owner'}</button></div>`).join('') || '<span style="color:var(--dim);font-size:13px">Nobody else has joined yet. Share Flixcord with your friends first.</span>'}`;
          body.querySelectorAll('[data-co]').forEach(b => b.onclick = async () => { b.disabled = true; await toggleCo(s, b.dataset.co); setTimeout(() => { s = S.servers.find(x => x.id === s.id) || s; show('team'); }, 400); });
        }
      };
      ok.onclick = async () => {
        const name = o.querySelector('#sName').value.trim().slice(0, 40); if (!name) return;
        try { await S.db.doc('servers/' + s.id).update({ name, emoji: st.emoji, color: st.color, icon: st.icon || null }); close(); toast('Saved'); } catch (e) { writeError(e); }
      };
      o.querySelectorAll('.settings-tabs button').forEach(b => b.onclick = () => show(b.dataset.t));
      show(tab || 'general');
    });
}
function channelModal(c, type) {
  type = c ? (c.type || 'text') : (type || 'text');
  modal(`<div class="mh"><h2>${c ? 'Edit channel' : 'Create channel'}</h2><p>${c ? '' : 'in ' + esc(curServer().name)}</p></div><div class="mb">
    ${c ? '' : `<div class="field"><label>Channel type</label><div class="chips"><button class="chip" data-type="text"># Text</button><button class="chip" data-type="voice">🔊 Voice</button></div></div>`}
    <div class="field"><label>Channel name</label><input id="cName" maxlength="32" value="${esc(c ? c.name : '')}" placeholder="new-channel"></div>
    <div class="field" id="topicField"><label>Topic</label><input id="cTopic" maxlength="120" value="${esc(c ? c.topic || '' : '')}" placeholder="What is this channel about?"></div></div>
    <div class="mf"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" data-ok>${c ? 'Save' : 'Create channel'}</button></div>`,
    (o, close) => {
      const inp = o.querySelector('#cName');
      const setType = t => { type = t; o.querySelectorAll('[data-type]').forEach(b => b.classList.toggle('sel', b.dataset.type === t)); o.querySelector('#topicField').classList.toggle('hidden', t === 'voice'); };
      o.querySelectorAll('[data-type]').forEach(b => b.onclick = () => setType(b.dataset.type)); setType(type);
      inp.oninput = () => { if (type === 'voice') return; const p = inp.selectionStart; inp.value = inp.value.toLowerCase().replace(/\s/g, '-'); inp.selectionStart = inp.selectionEnd = p; };
      o.querySelector('[data-x]').onclick = close;
      o.querySelector('[data-ok]').onclick = async () => {
        const name = type === 'voice' ? inp.value.trim().slice(0, 32) : slug(inp.value); if (!name) return toast('Give the channel a name', true);
        const topic = type === 'voice' ? '' : o.querySelector('#cTopic').value.trim().slice(0, 120);
        try {
          if (c) await S.db.doc('channels/' + c.id).update({ name, topic });
          else { const pos = serverChannels(S.sid).reduce((m, x) => Math.max(m, x.pos || 0), -1) + 1; const ref = await S.db.collection('channels').add({ sid: S.sid, name, topic, type, pos, at: Date.now() }); if (type === 'text') openChannel(ref.id); }
          close();
        } catch (e) { writeError(e); }
      };
    });
}
async function deleteChannel(c) {
  try {
    const snap = await S.db.collection(`ch/${c.id}/m`).limit(1000).get();
    for (const d of snap.docs) await S.db.doc(`ch/${c.id}/m/${d.id}`).delete();
    await S.db.doc('channels/' + c.id).delete();
    if (S.cid === c.id) { S.cid = null; pickChannel(); }
    toast('#' + c.name + ' deleted');
  } catch (e) { writeError(e); }
}
async function deleteServer(s) {
  toast('Deleting ' + s.name + '…');
  for (const c of serverChannels(s.id)) await deleteChannel(c);
  try { await S.db.doc('servers/' + s.id).delete(); toast(s.name + ' deleted'); } catch (e) { writeError(e); }
}

function openSettings(tab) {
  const p = S.profiles[S.myId] || {};
  const themes = [['flix', 'Flix', 'linear-gradient(135deg,#ff3d6e,#8b5cf6)'], ['midnight', 'Midnight', 'linear-gradient(135deg,#4f7cff,#22c1ee)'], ['grass', 'Grass', 'linear-gradient(135deg,#8be05a,#2e9e5b)'], ['light', 'Light', 'linear-gradient(135deg,#f3f1f8,#cfc6ea)']];
  modal(`<div class="mh" style="text-align:left;display:flex;gap:14px;align-items:center">${S.myId ? avatarHtml(S.myId, 56) : ''}<div><h2>${esc(nameOf(S.myId))}</h2><p style="margin-top:2px">Your name and picture come from your Claude account.</p></div></div>
    <div class="settings-tabs"><button data-t="profile">Profile</button><button data-t="look">Appearance</button><button data-t="help">Help</button></div>
    <div class="mb" id="setBody"></div><div class="mf"><button class="btn primary" data-x>Done</button></div>`, (o, close) => {
    o.querySelector('[data-x]').onclick = close;
    const show = t => {
      o.querySelectorAll('.settings-tabs button').forEach(b => b.classList.toggle('active', b.dataset.t === t));
      const b = o.querySelector('#setBody');
      if (t === 'profile') {
        b.innerHTML = S.canWrite && S.myId ? `<div class="field"><label>Profile picture</label><div class="uploader"><div class="pv" id="pAv"></div><div><button class="btn sm" id="pAvUp">Upload picture</button> <button class="btn sm" id="pAvRm">Use Claude picture</button></div></div></div>
          <div class="field"><label>Profile banner</label><div class="uploader"><div class="pv wide" id="pBn"></div><div><button class="btn sm" id="pBnUp">Upload banner</button> <button class="btn sm" id="pBnRm">Remove</button></div></div></div>
          <div class="field"><label>Custom status</label><input id="pCustom" maxlength="60" value="${esc(p.custom || '')}" placeholder="🎮 Playing Apex Client"></div>
          <div class="field"><label>About me</label><textarea id="pAbout" rows="3" maxlength="190" placeholder="Say something about yourself">${esc(p.about || '')}</textarea></div>
          <div class="field"><label>Status</label><div class="chips">${[['online', 'Online', 'var(--ok)'], ['idle', 'Idle', 'var(--idle)'], ['dnd', 'Do not disturb', 'var(--dnd)'], ['invisible', 'Invisible', 'var(--dim)']].map(([k, l, c]) => `<button class="chip ${S.status === k ? 'sel' : ''}" data-s="${k}"><span class="sw" style="background:${c}"></span>${l}</button>`).join('')}</div></div>
          <button class="btn primary" id="pSave">Save profile</button>` : '<p style="color:var(--muted)">You can view Flixcord but not change your profile. Ask the owner to invite you as an Editor.</p>';
        b.querySelectorAll('[data-s]').forEach(x => x.onclick = () => { setStatus(x.dataset.s); b.querySelectorAll('[data-s]').forEach(y => y.classList.toggle('sel', y === x)); });
        const imgs = { avatar: p.avatar || null, banner: p.banner || null };
        const drawImgs = () => {
          if (!b.querySelector('#pAv')) return;
          b.querySelector('#pAv').innerHTML = imgs.avatar ? `<img src="${blob(imgs.avatar)}" alt="">` : avatarHtml(S.myId, 64).replace('class="av"', 'class="av" style="width:64px;height:64px"');
          b.querySelector('#pBn').innerHTML = imgs.banner ? `<img src="${blob(imgs.banner)}" alt="">` : ''; b.querySelector('#pBn').style.background = imgs.banner ? '' : 'var(--grad)';
          b.querySelector('#pAvRm').classList.toggle('hidden', !imgs.avatar); b.querySelector('#pBnRm').classList.toggle('hidden', !imgs.banner);
        };
        const saveImg = async (k, v) => { imgs[k] = v; drawImgs(); try { await S.db.doc('profiles/' + S.myId).set({ ...(S.profiles[S.myId] || {}), [k]: v, joinedAt: p.joinedAt || Date.now() }); toast(v ? 'Saved ✨' : 'Removed'); } catch (e) { writeError(e); } };
        if (b.querySelector('#pAvUp')) {
          b.querySelector('#pAvUp').onclick = () => pickFile(async f => { const id = await uploadImage(f, 8); if (id) saveImg('avatar', id); });
          b.querySelector('#pBnUp').onclick = () => pickFile(async f => { const id = await uploadImage(f, 10); if (id) saveImg('banner', id); });
          b.querySelector('#pAvRm').onclick = () => saveImg('avatar', null);
          b.querySelector('#pBnRm').onclick = () => saveImg('banner', null);
          drawImgs();
        }
        const sv = b.querySelector('#pSave');
        if (sv) sv.onclick = async () => {
          const custom = b.querySelector('#pCustom').value.trim().slice(0, 60), about = b.querySelector('#pAbout').value.trim().slice(0, 190);
          try { await S.db.doc('profiles/' + S.myId).set({ ...(S.profiles[S.myId] || {}), status: S.status, custom, about, avatar: imgs.avatar, banner: imgs.banner, joinedAt: p.joinedAt || Date.now() }); toast('Profile saved'); } catch (e) { writeError(e); }
        };
      } else if (t === 'look') {
        b.innerHTML = `<div class="field"><label>Theme</label><div class="chips">${themes.map(([k, l, g]) => `<button class="chip ${S.theme === k ? 'sel' : ''}" data-th="${k}"><span class="sw" style="background:${g}"></span>${l}</button>`).join('')}</div></div>
          <div class="field"><label>Message density</label><div class="chips"><button class="chip ${!S.compact ? 'sel' : ''}" data-d="0">Cozy</button><button class="chip ${S.compact ? 'sel' : ''}" data-d="1">Compact</button></div></div>`;
        b.querySelectorAll('[data-th]').forEach(x => x.onclick = () => { S.theme = x.dataset.th; ls.set('theme', S.theme); document.documentElement.dataset.theme = S.theme; b.querySelectorAll('[data-th]').forEach(y => y.classList.toggle('sel', y === x)); });
        b.querySelectorAll('[data-d]').forEach(x => x.onclick = () => { S.compact = x.dataset.d === '1'; ls.set('compact', S.compact); applyCompact(); b.querySelectorAll('[data-d]').forEach(y => y.classList.toggle('sel', y === x)); });
      } else {
        b.innerHTML = `<div style="font-size:13.5px;line-height:1.7;color:var(--muted)">
          <b style="color:var(--text)">Formatting</b><br>**bold**, *italic*, __underline__, ~~strike~~, \`code\`, \`\`\`code block\`\`\`, ||spoiler||, &gt; quote, :fire: :skull: :goat:<br><br>
          <b style="color:var(--text)">Commands</b><br>/poll Question | Option 1 | Option 2 — /me action — /spoiler text — /shrug — /tableflip<br><br>
          <b style="color:var(--text)">Shortcuts</b><br>📞 phone button = call the channel · 🔊 voice channels · click someone → Call<br>Enter send · Shift+Enter new line · ↑ edit your last message · Esc cancel · @ mention someone · paste or drop an image<br><br>
          <b style="color:var(--text)">Inviting friends</b><br>The owner shares this page from claude.ai and invites friends by email as <b>Editors</b> (or Contributors in the same team) so they can chat.</div>`;
      }
    };
    o.querySelectorAll('.settings-tabs button').forEach(b => b.onclick = () => show(b.dataset.t));
    show(tab || 'profile');
  });
}
function applyCompact() {
  let st = $('compactCss');
  if (!st) { st = document.createElement('style'); st.id = 'compactCss'; document.head.appendChild(st); }
  st.textContent = S.compact ? '.msg{margin-top:4px;padding-top:1px;padding-bottom:1px}.msg .av{width:24px!important;height:24px!important}.msg .txt{line-height:1.35}' : '';
}

// ====================================================================== empty state
function emptyState() {
  const loading = !coreLoaded.servers;
  if (loading) return '<div class="empty-main"><div><div class="spin"></div><p style="margin-top:14px">Loading servers…</p></div></div>';
  return `<div class="empty-main"><div style="max-width:420px"><div style="width:96px;height:96px;margin:0 auto">${LOGO}</div><h2>Welcome to Flixcord${S.myId ? ', ' + esc(nameOf(S.myId)) : ''}!</h2>
    <p>${S.canWrite ? 'Create the first server and invite your friends. Channels, reactions, polls, images and more are ready.' : 'Nobody has created a server yet. When the owner makes one it appears here.'}</p>
    ${S.canWrite ? '<button class="btn primary" style="margin-top:18px" id="emptyCreate">Create a server</button>' : ''}</div></div>`;
}
function bindEmpty() { const b = $('emptyCreate'); if (b) b.onclick = createServerModal; }

function renderAll() { renderRail(); renderChannels(); renderMe(); renderHeader(); renderFeed(nearBottom()); renderMembers(); if (S.panel) renderPanel(); }

applyCompact();
boot().catch(e => { $('splashSpin').classList.add('hidden'); $('splashText').textContent = 'Flixcord could not start: ' + (e && e.message || e); });
})();
</script>
</body>
</html>
