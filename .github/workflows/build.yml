name: Build Apex Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    name: Build in-game mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        working-directory: ApexClient
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
          cp build/libs/ApexClient-*[0-9].jar ../ApexClient.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: ApexClient.jar

  launcher:
    name: Build Windows installer
    needs: mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mod
          path: ApexLauncher/resources/mods
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ApexLauncher/package-lock.json
      - name: Build installer
        working-directory: ApexLauncher
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: ApexLauncher/dist/ApexClient-Setup-*.exe

  release:
    name: Publish release
    needs: [mod, launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Apex Client (build ${{ github.run_number }})
          make_latest: true
          body: |
            **Players:** download `ApexClient-Setup-*.exe` and run it (Windows 10 / 11).
            The launcher always downloads the newest `ApexClient.jar` from the latest release.
          files: |
            out/mod/ApexClient.jar
            out/installer/ApexClient-Setup-*.exe
